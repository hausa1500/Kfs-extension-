name: Verify extension

on:
  push:
    branches: [main, fix/startup-license-mobile-flow, fix/final-startup-verification]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          for f in $(find . -type f \( -name "*.js" -o -name "*.mjs" \) -not -path './.git/*'); do node --check "$f"; done
      - name: Verify ChatGPT task lifecycle
        run: node scripts/verify-chatgpt-lifecycle.mjs
      - name: Validate startup architecture and integrity
        run: node scripts/verify-startup-architecture.mjs
      - name: Package extension
        run: |
          mkdir -p dist
          zip -r "dist/kfs-extension-v1.9.0-${GITHUB_SHA}.zip" \
            manifest.json background.js licensing.js license-ui.js license.html \
            popup.html popup.js popup.css content styles assets
      - name: Upload extension package
        uses: actions/upload-artifact@v4
        with:
          name: kfs-extension-v1.9.0-${{ github.sha }}
          path: dist/kfs-extension-v1.9.0-${{ github.sha }}.zip
          if-no-files-found: error
